{% extends 'base.html' %}

{% block title %}Delete Department — Damak Municipality IMS{% endblock %}

{% block content %}
<div class="container-fluid px-0">

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card ims-card border-0 shadow-sm text-center p-4">
                <div class="card-body">
                    <div class="rounded-circle ims-badge-soft-danger mx-auto d-flex align-items-center justify-content-center mb-3" style="width:64px;height:64px;font-size:1.75rem;">
                        <i class="bi bi-exclamation-triangle text-danger"></i>
                    </div>
                    <h4 class="fw-bold text-dark">Delete Department?</h4>
                    <p class="text-muted mb-4">Are you sure you want to delete department <strong>"{{ department.name }}"</strong>? This action cannot be undone.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-2">
                            <a href="{% url 'department_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                            <button type="submit" class="btn btn-danger px-4 fw-semibold">Delete Department</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
{% endblock %}
